<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)" />
  <title>Кроссворды</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f1ea;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #14161c; }
    }
    #app {
      width: 100%;
      height: 100%;
    }
  </style>
  <!-- SDK Яндекс Игр не подключён тегом в разметке намеренно: инлайновые
       <script>/onload-атрибуты — потенциальный риск при более строгом CSP
       на других хостингах, поэтому /sdk.js создаётся и подключается
       программно из src/yandex/sdk.js (document.createElement +
       .onload/.onerror как JS-свойства). Заодно это устраняет гонку
       состояний между async-загрузкой скрипта и нашим модулем. -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
